# set -g @tmux2k-right-plugins "time"
# set -g @tmux2k-time-format "%a %I:%M"
# set -g @tmux2k-cwd-length 25

set -g @plugin 'odedlaz/tmux-onedark-theme'

# set vi-mode
set-window-option -g mode-keys vi

# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Keybindings for new session
bind S new-session
# bind S command-prompt -p "New session name: " "new-session -s '%%'"
# bind S run-shell "n=0; while tmux has-session -t \$n 2>/dev/null; do n=\$((n+1)); done; tmux new-session -d -s \$n; tmux switch-client -t \$n"

# set-option -g pane-border-fg white
set-option -ga terminal-overrides ",xterm*:Ss=\e[5 q"

set -as terminal-features 'xterm-kitty:cstyle'

# Ensure the terminal reports the cursor shape correctly
set -as terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# If using a specific terminal, you might need to enable cstyle
# set -as terminal-features ',rxvt*:cstyle'

# Pane separators
set -g pane-border-lines simple
set -g pane-border-style fg=black,bright
set -g pane-active-border-style fg=magenta

# Quality of Life
set -g escape-time 0
set -g mouse on
set -g repeat-time 1000
set -g history-limit 10000

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
